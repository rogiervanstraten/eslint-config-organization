name: 'CI'
on:
  pull_request:
    branches:
      - 'main'
jobs:
  build-and-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci --include=dev --ignore-scripts
      - name: Test build
        run: npm run build
      - name: Run tests
        run: npm test
